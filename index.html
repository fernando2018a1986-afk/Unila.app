<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unila App</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22c55e">

<style>
:root { --bg:#0f172a; --card:#1e293b; }
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial;background:#0f172a;color:white;}
header{display:flex;padding:10px;background:#1e293b;}
.home-top{flex:1;margin:0 10px;padding:12px;border:none;border-radius:10px;background:#22c55e;color:white;font-weight:bold;}

.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;padding:16px;}
button{padding:16px;border:none;border-radius:12px;font-weight:bold;color:white;}

.install-btn{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#22c55e;
padding:14px 20px;
border-radius:12px;
display:none;
z-index:999;
}

.install-banner{
text-align:center;
padding:10px;
background:#22c55e;
color:black;
font-weight:bold;
}

.unila{background:#2563eb;}
.sigaa{background:#9333ea;}
.gmail{background:#ea4335;}
.google{background:#fbbc05;color:black;}
.instagram{background:#d62976;}
.facebook{background:#1877f2;}
.biblioteca{background:#8b5cf6;}
.intercampi{background:#0ea5e9;}
.smartec{background:#06b6d4;}
.editais{background:#0d9488;}
.alertas{background:#f59e0b;color:black;}
.emergencia{background:#dc2626;}
.enderecos{background:#eab308;color:black;}
.ru{background:#f97316;}
.info{background:#1877f2;}
.dev{background:#6366f1;}
.notes{background:#14b8a6;}
.share{background:#10b981;}
.internet{background:#3b82f6;}
.estude{background:#22c55e;}
.update{background:#0ea5e9;}

.page{display:none;padding:20px;line-height:1.6;}
textarea{width:100%;height:120px;border-radius:10px;padding:10px;margin-bottom:10px;}
</style>
</head>

<body>

<div id="bannerInstall" class="install-banner">
📲 Para melhor experiência, instale este app no seu celular
</div>

<header>
<button onclick="goBack()">⬅</button>
<button class="home-top" onclick="goHome()">🏠 Página Inicial</button>
</header>

<!-- botão flutuante -->
<button id="installBtn" class="install-btn">📲 Instalar App</button>

<div id="home" class="menu">

<button class="unila" onclick="openLink('https://portal.unila.edu.br/')">Portal da UNILA</button>
<button class="sigaa" onclick="openLink('https://sig.unila.edu.br/sigaa/verTelaLogin.do')">SIGAA</button>
<button class="gmail" onclick="openLink('https://mail.google.com/')">E-mail Institucional</button>
<button class="google" onclick="openLink('https://www.google.com/')">Google</button>
<button class="instagram" onclick="openLink('https://www.instagram.com/instaunila/')">Instagram Unila</button>
<button class="facebook" onclick="openLink('https://www.facebook.com/unila.oficial')">UNILA Facebook</button>
<button class="biblioteca" onclick="openLink('https://portal.unila.edu.br/biblioteca')">Biblioteca</button>
<button class="intercampi" onclick="openLink('https://portal.unila.edu.br/proagi/delog/arquivos/horario-intercampi/quadro-de-horario-intercampi.pdf')">Intercampi</button>
<button class="smartec" onclick="openLink('https://www.facebook.com/profile.php?id=61562436416014')">Smart Tech</button>
<button class="editais" onclick="openLink('https://documentos.unila.edu.br/')">Portal de Editais</button>

<button class="alertas" onclick="openPage('alertasPage')">🔔 Alertas</button>
<button class="emergencia" onclick="openPage('emergenciaPage')">🚨 Emergência</button>
<button class="enderecos" onclick="openPage('enderecosPage')">🏫 Campus da Unila</button>
<button class="ru" onclick="openPage('ruPage')">🍽️ Restaurantes (RU)</button>
<button class="info" onclick="openLink('https://facebook.com/groups/1469303078173697/')">Grupo no Facebook</button>
<button class="dev" onclick="openPage('devPage')">Desenvolvedor</button>
<button class="notes" onclick="openPage('notesPage')">📝 Anotações</button>
<button class="share" onclick="shareApp()">📤 Compartilhar</button>
<button class="internet" onclick="openPage('internetPage')">Configurar Internet</button>
<button class="estude" onclick="openPage('estudPage')">Estude na UNILA</button>
<button class="update" onclick="updateApp()">🔄 Atualizar App</button>

<!-- NOVO BOTÃO -->
<button class="update" onclick="instalarApp()">📲 Baixar App</button>

</div>

<!-- TODOS OS TEXTOS ORIGINAIS MANTIDOS (alertas, emergência, campus, RU, etc.) -->

<script>
let historyStack=[];
function openLink(u){window.open(u);}
function openPage(id){
historyStack.push(id);
document.getElementById("home").style.display="none";
document.querySelectorAll(".page").forEach(p=>p.style.display="none");
document.getElementById(id).style.display="block";
}
function goBack(){
historyStack.pop();
if(historyStack.length===0){goHome();return;}
document.querySelectorAll(".page").forEach(p=>p.style.display="none");
document.getElementById(historyStack[historyStack.length-1]).style.display="block";
}
function goHome(){
historyStack=[];
document.querySelectorAll(".page").forEach(p=>p.style.display="none");
document.getElementById("home").style.display="grid";
}

function shareApp(){
const url="https://fernando2018a1986-afk.github.io/Unila.app/";
const text="📱 UNILA App\nInstale na tela inicial:\n"+url;
if(navigator.share){
navigator.share({title:"UNILA App",text:text,url:url});
}else{
window.open("https://wa.me/?text="+encodeURIComponent(text));
}
}

function updateApp(){location.reload();}

/* instalação */
let deferredPrompt=null;

window.addEventListener("beforeinstallprompt",(e)=>{
e.preventDefault();
deferredPrompt=e;
document.getElementById("installBtn").style.display="block";
});

async function instalarApp(){
if(deferredPrompt){
deferredPrompt.prompt();
await deferredPrompt.userChoice;
deferredPrompt=null;
}else{
alert(`📲 INSTALAR APP

Android:
1. Clique nos 3 pontos do navegador
2. "Adicionar à tela inicial"

iPhone:
1. Botão compartilhar
2. "Adicionar à Tela de Início"
`);
}
}

document.getElementById("installBtn").onclick=instalarApp;

if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
